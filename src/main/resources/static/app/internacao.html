<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMI - Internações em Tempo Real</title>
    <!-- Include SockJS and STOMP.js client libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" type"text/css" href="css/internacao.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Monitor de Internações CMI</h2>
        <span id="connectionStatus" class="status-badge status-disconnected">Desconectado</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID / Registro</th>
                <th>Paciente</th>
                <th>Leito</th>
                <th>Médico Responsável</th>
                <th>Data de Internação</th>
            </tr>
        </thead>
        <tbody id="internacoesTableBody">
            <tr id="emptyRow">
                <td colspan="5" class="no-data">Aguardando dados de internação...</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="js/internacao.js"></script>

</body>
</html>
