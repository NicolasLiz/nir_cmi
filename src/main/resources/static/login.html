<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMI - Hospital Management System - Login</title>
    <link rel="stylesheet" type="text/css" href="css/login.css">
</head>
<body>

    <div class="login-card">
        <h2>CMI Hospital Login</h2>
        <!-- Form points to your backend login endpoint using GET (matching RequestParam) -->
<form id="loginForm">
    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="seu@email.aqui">
    </div>
    
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
    </div>

    <button type="submit" class="btn-submit">Sign In</button>
</form>

<script src="js/login.js"></script>
</div>

</body>
</html>
